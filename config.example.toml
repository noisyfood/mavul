control_workers = 4
device_state_dir = "memory/devices"
recovery_agent_id = "recovery"

[agents.reverser]
workspace = "memory/reverser"
max_concurrency = 2

[agents.reverser.codex]
experimental_api = false
# Authenticate Codex with this home before startup.
home = "memory/codex"

[agents.reverser.main]
model = "gpt-5.6-terra"
effort = "high"
approval_mode = "deny_all"

[agents.reverser.worker]
model = "gpt-5.6-terra"
effort = "high"
approval_mode = "deny_all"

[agents.reverser.mcp_servers.ida]
command = "/absolute/path/to/ida-mcp"
args = []

[devices.lab_router]
name = "Lab router"
ip_address = "192.0.2.10"
telnet_port = 23
